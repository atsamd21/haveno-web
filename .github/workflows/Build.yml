name: Build

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build
        run: dotnet publish Merkato.Launcher/Merkato.Launcher.csproj -c Release -r win-x64 --self-contained true -o publish/win-x64
        
      - name: Build installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" Merkato.Launcher\Installer\haveno-web.iss'

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: Merkato.Launcher/Installer/Output/*.exe

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          prerelease: true
          files: Merkato.Launcher/Installer/Output/*.exe

  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build
        run: dotnet publish Merkato.Launcher/Merkato.Launcher.csproj -c Release -r linux-x64 --self-contained true -o publish/linux-x64