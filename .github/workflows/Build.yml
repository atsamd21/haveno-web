name: Build

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build
        run: dotnet publish Merkato.Launcher/Merkato.Launcher.csproj -c Release -r win-x64 --self-contained true -o publish/win-x64
        
      - name: Build installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" Merkato.Launcher\Installer\haveno-web.iss'

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: Merkato.Launcher/Installer/Output/*.exe

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          prerelease: true
          files: Merkato.Launcher/Installer/Output/*.exe

  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build
        run: dotnet publish Merkato.Launcher/Merkato.Launcher.csproj -c Release -r linux-x64 --self-contained true -o publish/linux-x64

      - name: Move files to AppDir
        working-directory: Merkato.Launcher/Installer
        run: |
          cp -r ../../publish/linux-x64/. AppDir/usr/bin/
          chmod +x AppDir/AppRun AppDir/usr/bin/Merkato.Launcher

      - name: Build AppImage
        working-directory: Merkato.Launcher/Installer
        run: |
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ARCH=x86_64 ./appimagetool-x86_64.AppImage --appimage-extract-and-run AppDir haveno-web-linux-x86_64.AppImage

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          prerelease: true
          files: Merkato.Launcher/Installer/haveno-web-linux-x86_64.AppImage